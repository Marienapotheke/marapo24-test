name: Protected proof tests (emulators only)
on:
  push:
    branches: [test-geschuetzte-zustellnachweise]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir functions install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm test:emulator
